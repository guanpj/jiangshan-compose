name: iosApp
options:
  bundleIdPrefix: com.jiangshan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: 江山
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Required by Compose Multiplatform on iOS (high refresh rate).
        # Without it PlistSanityCheck throws at launch on a real device.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangshan.atlas
        DEVELOPMENT_TEAM: "82NYF3Z53A"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          # Always build/embed the current Kotlin framework. Running only the
          # resource-sync task leaves an old framework behind when Xcode is
          # driven by an IDE, which makes code changes appear not to take effect.
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

          atlas="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources/composeResources/com.jiangshan.atlas.res/files/atlas"
          for resource in atlas.json rings.bin settlements.json era_spans.json; do
            if [ ! -s "$atlas/$resource" ]; then
              echo "error: Missing Compose resource in the iOS app bundle: $resource"
              exit 1
            fi
          done
